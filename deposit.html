<!DOCTYPE html>
<html>
<head>
  <title>Booking Deposit</title>

  <script src="https://sandbox.web.squarecdn.com/v1/square.js"></script>

  <style>
    body{
      font-family: Inter, sans-serif;
      padding:40px;
      background:#fafafa;
      display:flex;
      justify-content:center;
    }

    .paymentBox{
      width:420px;
      background:white;
      padding:30px;
      border-radius:14px;
      box-shadow:0 10px 40px rgba(0,0,0,.1);
    }

    #card-container{
      margin-top:20px;
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:14px;
      font-weight:700;
      border:none;
      border-radius:8px;
      background:black;
      color:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="paymentBox">

<h2>$25 Booking Deposit</h2>

<p>This deposit secures your appointment and goes toward your service total.</p>

<div id="card-container"></div>

<button id="payBtn">Pay Deposit</button>

</div>

<script>

const payments = Square.payments(
  "sq0idp-9rqrzxMJ-huh115bZkPH5Q",
  "LV9XSE8KC6F93"
);

async function init(){
  const card = await payments.card();
  await card.attach("#card-container");

  document
    .getElementById("payBtn")
    .addEventListener("click", async () => {

      const result = await card.tokenize();

      const response = await fetch("/api/create-payment", {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          sourceId: result.token
        })
      });

      const data = await response.json();

      if(data.payment){
        alert("Deposit successful!");
        window.location.href = "/";
      }else{
        alert("Payment failed");
      }

    });
}

init();

</script>

</body>
</html>

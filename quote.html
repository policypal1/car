<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RZQ6CD7XZD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "G-RZQ6CD7XZD");
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get a Quote | Keizer Mobile Detailing</title>
    <meta name="description" content="Get a mobile detailing quote from Keizer Mobile Detailing." />

    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="//www.googletagmanager.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./Untitled design (4).png" type="image/png" />
    <link rel="apple-touch-icon" href="./Untitled design (2).png" />

    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./quote-wizard.css" />

    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
      body.quotePageBody {
        min-height: 100vh;
        background:
          radial-gradient(900px 360px at 14% 0%, rgba(214, 178, 94, 0.16), rgba(255, 255, 255, 0) 62%),
          linear-gradient(180deg, #f7f4ee 0%, #ffffff 100%);
      }

      .quotePageHeader {
        position: relative;
        z-index: 10;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .quotePageHeader .brand {
        text-decoration: none;
      }

      .quotePageHeader__actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .quotePageHeader__link {
        color: #111;
        font-weight: 800;
        text-decoration: none;
      }

      .quotePageMain {
        width: min(980px, calc(100% - 2rem));
        margin: 0 auto;
        padding: clamp(1.25rem, 4vw, 3rem) 0 4rem;
      }

      .quotePageIntro {
        display: grid;
        gap: 0.65rem;
        margin: 0 auto 1.15rem;
        text-align: center;
      }

      .quotePageKicker {
        margin: 0;
        color: rgba(0, 0, 0, 0.62);
        font-size: 0.84rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .quotePageTitle {
        margin: 0;
        color: #111;
        font-family: Oswald, Inter, sans-serif;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .quotePageSub {
        max-width: 42rem;
        margin: 0 auto;
        color: rgba(0, 0, 0, 0.64);
        font-size: 1rem;
        line-height: 1.65;
      }

      .quotePageShell {
        display: block;
      }

      .quotePanel--page {
        width: min(900px, 100%);
        max-height: none;
        margin: 0 auto;
        overflow: visible;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.12);
      }

      .quotePanel--page .modal__close {
        position: absolute;
        top: 14px;
        right: 14px;
      }

      .quotePanel--page .quoteTop {
        padding-right: 48px;
      }

      @media (max-width: 720px) {
        .quotePageHeader .header__inner {
          gap: 0.85rem;
        }

        .quotePageHeader__actions {
          display: none;
        }

        .quotePageMain {
          width: min(100% - 1rem, 980px);
          padding-top: 1rem;
        }

        .quotePageIntro {
          text-align: left;
          padding-inline: 0.35rem;
        }

        .quotePageSub {
          margin: 0;
        }

        .quotePanel--page {
          border-radius: 18px;
          padding: 14px;
        }

        .quotePanel--page .quoteTop {
          padding-right: 44px;
        }
      }
    </style>
  </head>

  <body class="quotePageBody" data-quote-page="true">
    <header class="header quotePageHeader" id="top">
      <div class="container header__inner">
        <a class="brand" href="./index.html" aria-label="Back to home">
          <img
            class="brand__logo"
            src="./Untitled design (2).png"
            alt="Keizer Mobile Detailing logo"
            loading="eager"
            fetchpriority="high"
            decoding="async"
            width="74"
            height="74"
          />
          <div class="brand__text">
            <span class="brand__name">
              <span class="brand__nameLine">Keizer Mobile</span>
              <span class="brand__nameLine">Detailing</span>
            </span>
          </div>
        </a>

        <div class="quotePageHeader__actions">
          <a class="quotePageHeader__link" href="./index.html">Home</a>
          <a class="btn btn--call" href="tel:+19712865503">CALL / TEXT</a>
        </div>
      </div>
    </header>

    <main class="quotePageMain" data-quote-modal aria-hidden="false">
      <div class="quotePageIntro">
        <p class="quotePageKicker">Online estimate</p>
        <h1 class="quotePageTitle">Get Your Quote</h1>
        <p class="quotePageSub">
          Choose your vehicle, service, package, and preferred appointment time. We’ll review the request and confirm the final details by text or email.
        </p>
      </div>

      <section class="quotePanel quotePanel--page" aria-label="Get a quote">
        <button class="modal__close" aria-label="Back to home" data-quote-close>&#215;</button>

        <div class="quoteTop">
          <h2 class="quoteTitle">GET A QUOTE</h2>
          <div class="quoteProgress" aria-hidden="true">
            <span class="qpDot isOn"></span><span class="qpDot"></span><span class="qpDot"></span><span class="qpDot"></span><span class="qpDot"></span>
            <span class="qpDot"></span><span class="qpDot"></span><span class="qpDot"></span><span class="qpDot"></span><span class="qpDot"></span>
          </div>
        </div>

        <div class="quoteBody" data-quote-body></div>

        <div class="quoteNav">
          <button class="btn btn--quote quoteBack" type="button" data-quote-back>Back</button>
          <button class="btn btn--call quoteNext" type="button" data-quote-next>Continue</button>
        </div>
      </section>
    </main>

    <script src="./quote-wizard.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof gtag === "function") {
          gtag("event", "generate_lead", {
            event_category: "engagement",
            event_label: "quote_page_view"
          });
        }
      });
    </script>
  </body>
</html>

    <style>
/* quote-wizard.css */
/* Quote wizard */
.quotePanel{
  position:relative;
  width:min(820px, 100%);
  background:#fff;
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:18px;
  max-height:calc(100vh - 3rem);
  overflow:auto;
}

/* ✅ kill switch: if any old bottom price pill exists, never show it */
.qNavPrice{ display:none !important; }

.quoteTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.quoteTitle{
  margin:0;
  font-family:Oswald, Inter, sans-serif;
  letter-spacing:.7px;
  text-transform:uppercase;
  color:var(--black);
}

.quoteProgress{ display:flex; gap:6px; margin-top:4px; }
.qpDot{
  width:10px; height:10px; border-radius:999px;
  border:1px solid rgba(0,0,0,.18);
  background:rgba(0,0,0,.06);
  padding:0;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  display:inline-block;
  flex:0 0 auto;
}
.qpDot.isOn{
  width:28px;
  background:rgba(214,178,94,.85);
  border-color:rgba(214,178,94,.95);
}

.quoteBody{ margin-top:14px; }
.qStepTitle{ margin:0 0 8px; font-weight:900; color:#111; }
.qStepSub{ margin:0 0 12px; color:rgba(0,0,0,.62); line-height:1.6; }

/* ✅ sticky nav (remove blur line) */
.quoteNav{
  position:sticky;
  bottom:0;
  z-index:5;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:space-between;
  margin-top:14px;
  padding-top:12px;
  padding-bottom:4px;
  background:#fff;
  border-top:1px solid rgba(0,0,0,.08);
}

.quoteBack{
  background:#fff;
  color:#000;
  border:2px solid rgba(0,0,0,.18);
  box-shadow:none;
}
.quoteNext{ min-width:160px; }

.qNavBundleNote{
  flex:1 1 auto;
  min-width:0;
  align-self:center;
  text-align:center;
  padding:0 10px;
  font-weight:850;
  font-size:.95rem;
  line-height:1.35;
  color:rgba(0,0,0,.72);
}

/* Cards base grid */
.qCards{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

/* Vehicle step: always 2x2 */
.qCards--vehicle2x2{
  grid-template-columns: 1fr 1fr;
}

/* ✅ scroll row pattern */
.qCards--scroll{
  display:flex;
  gap:12px;
  flex-wrap:nowrap;
  overflow-x:auto;
  padding-bottom:8px;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;
}
.qCards--scroll .qCard{
  flex:0 0 82%;
  scroll-snap-align:start;
}
.qCards--scroll .qFeatureCard{
  flex:0 0 90%;
}
@media (min-width:520px){
  .qCards--scroll .qCard{ flex:0 0 62%; }
  .qCards--scroll .qFeatureCard{ flex:0 0 72%; }
}
@media (min-width:768px){
  .qCards--scroll{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    overflow:visible;
    scroll-snap-type:none;
    padding-bottom:0;
  }
  .qCards--scroll .qCard{ flex:initial; }
}

/* ✅ hero cards */
.qCards--big .qCard{
  padding:12px;
  border-radius:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}
.qCards--big .qCardMedia{
  border-radius:16px;
}

/* Card base */
.qCard{
  text-align:left;
  border-radius:18px;
  border:1px solid rgba(0,0,0,.10);
  background:#fff;
  padding:12px;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
  transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
}
.qCard.isSel{
  border-color:rgba(214,178,94,.70);
  box-shadow:0 18px 44px rgba(214,178,94,.18);
}
.qCard:focus-visible{
  outline:none;
  box-shadow:0 0 0 4px rgba(214,178,94,.22), 0 12px 30px rgba(0,0,0,.08);
  border-color:rgba(214,178,94,.72);
}

.qCardMedia{
  width:100%;
  border-radius:16px;
  overflow:hidden;
  border:1px solid rgba(0,0,0,.08);
  background:rgba(0,0,0,.04);
  position:relative;
}

.qCard--img .qCardMedia{
  aspect-ratio: 16 / 9;
}

.qCardMedia img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

/* ✅ zoom support (used for Exterior condition Normal) */
.qCardMedia.isZoom img{
  transform: scale(var(--imgZoom, 1));
  transform-origin:center;
}

/* ✅ split media */
.qCardMediaSplit{
  display:flex;
  width:100%;
  height:100%;
}
.qCardMediaSplit img{
  width:50%;
  height:100%;
  object-fit:cover;
  display:block;
}
.qCardMediaSplit img + img{
  border-left:1px solid rgba(0,0,0,.10);
}

/* ✅ vertical split (Interior+Exterior category card) */
.qCardMediaSplit--v{
  flex-direction:column;
}
.qCardMediaSplit--v img{
  width:100%;
  height:50%;
}
.qCardMediaSplit--v img + img{
  border-left:none;
  border-top:1px solid rgba(0,0,0,.10);
}

/* ✅ badge (existing) */
.qCardBadge{
  position:absolute;
  top:8px;
  left:8px;
  width:22px;
  height:22px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:14px;
  color:#111;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(0,0,0,.14);
  box-shadow:0 8px 18px rgba(0,0,0,.14);
}

/* ✅ "Requires Exterior Wash" pill badge */
.requires-badge{
  position:absolute;
  top:10px;
  left:10px;
  background:#ffffff;
  color:#111;
  font-size:12px;
  padding:4px 8px;
  border-radius:999px;
  box-shadow:0 2px 6px rgba(0,0,0,0.15);
  font-weight:500;
  z-index:2;
  border:1px solid rgba(0,0,0,.10);
  pointer-events:none;
  max-width:calc(100% - 20px);
  white-space:nowrap;
}

/* Vehicle cards */
.qCard--vehicle .qCardMedia{
  aspect-ratio: 16 / 9;
  padding:10px;
  background:#fff;
  --carZoom: 1.26;
}
.qCard--vehicle img.isContain{
  object-fit:contain;
  background:#fff;
  transform: scale(var(--carZoom));
  transform-origin:center;
}

/* Square cards */
.qCard--square .qCardMedia{ aspect-ratio: 1 / 1; }
.qCard--square .qCardMedia img{ object-fit:cover; }

.qCardLabel{
  margin:10px 2px 2px;
  font-weight:900;
  color:#111;
}

.qCard--servicePick,
.qCard--condition{
  display:flex;
  flex-direction:column;
}

.qCard--servicePick .qCardMedia,
.qCard--condition .qCardMedia{
  width:100%;
}

.qCard--servicePick .qCardLabel,
.qCard--condition .qCardLabel{
  display:block;
  min-height:0;
}

/* ✅ allow newline (used on condition cards for "Starting at") */
.qCardHint{
  margin:0 2px 0;
  color:rgba(0,0,0,.62);
  font-weight:700;
  font-size:.95rem;
  line-height:1.45;
  white-space:pre-line;
}
.qCardHint:empty{ display:none; }

/* ✅ NEW detail cards for interior/exterior package steps */
.qFeatureCard{
  display:flex;
  align-items:stretch;
  min-height:100%;
}
.qFeatureCardInner{
  display:flex;
  flex-direction:column;
  width:100%;
  min-height:100%;
}
.qFeatureCardTitle{
  margin:2px 0 14px;
  text-align:center;
  font-weight:1000;
  color:#111;
  font-size:1.15rem;
  line-height:1.25;
}
.qFeatureList{
  margin:0;
  padding-left:20px;
  display:grid;
  gap:8px;
  color:rgba(0,0,0,.72);
  font-weight:800;
  font-size:.96rem;
  line-height:1.45;
}
.qFeatureList li::marker{
  color:rgba(0,0,0,.45);
}
.qFeaturePrice{
  margin-top:auto;
  padding-top:14px;
  text-align:center;
  font-weight:1000;
  color:#111;
  font-size:1rem;
}

/* ✅ Image-less package cards (Standard / Deep Clean / Premium) — premium feel */
.qFeatureCard--noImg{
  padding:0;
  background:#fff;
  border:1px solid rgba(0,0,0,.08);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 16px 36px rgba(0,0,0,.06);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.qFeatureCard--noImg:hover{
  transform:translateY(-2px);
  box-shadow:0 22px 48px rgba(0,0,0,.10);
}
.qFeatureCard--noImg .qFeatureCardInner{
  padding:22px 20px 20px;
  position:relative;
}
.qFeatureCard--noImg .qFeatureCardInner::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg, rgba(214,178,94,.0), rgba(214,178,94,.85), rgba(214,178,94,.0));
  opacity:0;
  transition: opacity .2s ease;
}
.qFeatureCard--noImg.isSel{
  border-color:rgba(214,178,94,.7);
  box-shadow:0 24px 56px rgba(214,178,94,.20), 0 0 0 4px rgba(214,178,94,.16);
  transform:translateY(-2px);
}
.qFeatureCard--noImg.isSel .qFeatureCardInner::before{
  opacity:1;
}
.qFeatureCard--noImg .qFeatureCardTitle{
  font-family:Oswald, Inter, sans-serif;
  font-size:1.35rem;
  letter-spacing:.5px;
  text-transform:uppercase;
  margin:0 0 6px;
  text-align:center;
  color:#111;
}
.qFeatureCard--noImg .qFeatureCardHint{
  text-align:center;
  color:rgba(0,0,0,.55);
  font-weight:600;
  font-size:.88rem;
  line-height:1.45;
  margin:0 0 16px;
  padding:0 4px;
}
.qFeatureCard--noImg .qFeatureList{
  list-style:none;
  padding:0;
  margin:0 0 16px;
  font-size:.94rem;
  gap:10px;
  display:flex;
  flex-direction:column;
}
.qFeatureCard--noImg .qFeatureList li{
  position:relative;
  padding-left:24px;
  color:rgba(0,0,0,.78);
  font-weight:600;
  line-height:1.45;
}
.qFeatureCard--noImg .qFeatureList li::before{
  content:"";
  position:absolute;
  left:2px;
  top:6px;
  width:14px;
  height:8px;
  border-left:2px solid rgba(214,178,94,.85);
  border-bottom:2px solid rgba(214,178,94,.85);
  transform:rotate(-45deg);
}
.qFeatureCard--noImg .qFeaturePrice{
  margin-top:auto;
  padding-top:16px;
  border-top:1px solid rgba(0,0,0,.08);
  font-family:Oswald, Inter, sans-serif;
  font-size:1.2rem;
  letter-spacing:.4px;
  color:#111;
  text-align:center;
}
.qFeatureCard--noImg.isSel .qFeaturePrice{
  border-top-color:rgba(214,178,94,.4);
}

/* ✅ Services tray (chips) */
.qServiceTray{
  border-radius:18px;
  border:1px solid rgba(0,0,0,.10);
  background:
    radial-gradient(800px 260px at 12% 0%, rgba(214,178,94,.12), rgba(255,255,255,0) 55%),
    rgba(0,0,0,.02);
  padding:12px;
  margin-bottom:12px;
}
.qServiceTrayTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.qServiceTrayTitle{
  font-weight:1000;
  color:#111;
  letter-spacing:.2px;
}
.qServiceTrayHint{
  font-weight:850;
  color:rgba(0,0,0,.60);
  font-size:.95rem;
  line-height:1.35;
}
.qChips{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.qChip{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:999px;
  border:1px solid rgba(0,0,0,.12);
  background:rgba(255,255,255,.92);
  box-shadow:0 10px 26px rgba(0,0,0,.06);
  font-weight:900;
  color:#111;
}
.qChip button{
  width:20px;
  height:20px;
  border-radius:999px;
  border:1px solid rgba(0,0,0,.14);
  background:#fff;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  line-height:1;
}
.qChip button:focus-visible{
  outline:none;
  box-shadow:0 0 0 4px rgba(214,178,94,.22);
  border-color:rgba(214,178,94,.72);
}
.qChipEmpty{
  font-weight:850;
  color:rgba(0,0,0,.55);
}

/* Fields */
.qGrid2{ display:grid; grid-template-columns:1fr; gap:10px; }

.qField label{ display:block; font-weight:900; margin-bottom:6px; color:#111; }
.qField input, .qField textarea, .qField select{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(0,0,0,.12);
  outline:none;
  font-weight:600;
  font-family:inherit;
  background:#fff;
}
.qField textarea{ min-height:92px; resize:vertical; }
.qField input:focus, .qField textarea:focus, .qField select:focus{
  border-color:rgba(214,178,94,.70);
  box-shadow:0 0 0 4px rgba(214,178,94,.18);
}

.qCheck{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:12px;
  border-radius:16px;
  border:1px solid rgba(0,0,0,.10);
  background:rgba(0,0,0,.02);
}
.qCheck input{ margin-top:4px; }

.qStatus{
  margin-top:8px;
  font-weight:800;
  color:rgba(0,0,0,.65);
}

/* ✅ bubble-box style (used for upkeep frequency) */
.qHearWrap{
  border-radius:18px;
  border:1px solid rgba(0,0,0,.10);
  background:
    radial-gradient(700px 240px at 10% 0%, rgba(214,178,94,.12), rgba(255,255,255,0) 55%),
    rgba(0,0,0,.02);
  padding:12px;
}
.qHearGrid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-top:10px;
}
.qHearBtn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  text-align:left;
  padding:12px 12px;
  border-radius:16px;
  border:1px solid rgba(0,0,0,.12);
  background:rgba(255,255,255,.92);
  cursor:pointer;
  box-shadow:0 10px 26px rgba(0,0,0,.06);
  transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
}
.qHearBtn:hover{ transform: translateY(-1px); }
.qHearBtn.isSel{
  border-color:rgba(214,178,94,.72);
  box-shadow:0 0 0 4px rgba(214,178,94,.18), 0 18px 44px rgba(214,178,94,.14);
}
.qHearBtn:focus-visible{
  outline:none;
  border-color:rgba(214,178,94,.85);
  box-shadow:0 0 0 4px rgba(214,178,94,.22), 0 10px 26px rgba(0,0,0,.08);
}
.qHearLeft{
  display:flex;
  flex-direction:column;
  gap:4px;
  min-width:0;
}
.qHearLabel{
  font-weight:1000;
  letter-spacing:.2px;
  color:#111;
  line-height:1.1;
}
.qHearHint{
  color:rgba(0,0,0,.62);
  font-weight:750;
  font-size:.95rem;
  line-height:1.35;
}
.qHearRight{
  display:inline-flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
}
.qHearPill{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid rgba(0,0,0,.10);
  background:rgba(0,0,0,.04);
  color:rgba(0,0,0,.72);
  font-weight:950;
  font-size:.82rem;
  text-transform:uppercase;
  letter-spacing:.7px;
}
.qHearCheck{
  width:18px; height:18px;
  border-radius:999px;
  border:2px solid rgba(0,0,0,.16);
  background:#fff;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,1);
}
.qHearBtn.isSel .qHearPill{
  border-color:rgba(214,178,94,.55);
  background:rgba(214,178,94,.12);
  color:rgba(0,0,0,.82);
}
.qHearBtn.isSel .qHearCheck{
  border-color:rgba(214,178,94,.85);
  background:rgba(214,178,94,.85);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,1);
}

/* =========================
   ✅ NEW: Estimate page
   ========================= */

.qEstimateHero{
  position:relative;
  border-radius:24px;
  padding:28px 22px 26px;
  background:
    radial-gradient(900px 320px at 20% 15%, rgba(214,178,94,.18), rgba(255,255,255,0) 55%),
    linear-gradient(180deg, #fff 0%, #fbf7ec 100%);
  border:1px solid rgba(214,178,94,.35);
  box-shadow:0 24px 60px rgba(0,0,0,.08);
  text-align:center;
  overflow:hidden;
}

.qEstimateEyebrow{
  font-size:.78rem;
  font-weight:1000;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:rgba(0,0,0,.55);
  margin-bottom:8px;
}

.qEstimateHeroTitle{
  margin:0 0 8px;
  font-family:Oswald, Inter, sans-serif;
  font-size:clamp(1.5rem, 4.5vw, 2rem);
  font-weight:900;
  letter-spacing:.5px;
  text-transform:uppercase;
  color:#111;
  line-height:1.1;
}

.qEstimateHeroSub{
  margin:0 auto 22px;
  max-width:520px;
  color:rgba(0,0,0,.62);
  font-weight:600;
  line-height:1.55;
  font-size:.96rem;
}

.qEstimateHeroPrice{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.qEstimateOld{
  color:rgba(0,0,0,.42);
  font-weight:900;
  text-decoration:line-through;
  font-size:1.05rem;
}

.qEstimateBig{
  margin:0;
  font-weight:1000;
  font-size:clamp(2.4rem, 8vw, 3.4rem);
  line-height:1;
  color:#111;
  letter-spacing:-.5px;
}

.qEstimatePills{
  margin-top:14px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.qPill{
  display:inline-flex;
  gap:6px;
  align-items:center;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid rgba(0,0,0,.10);
  background:rgba(255,255,255,.85);
  color:rgba(0,0,0,.72);
  font-weight:800;
  font-size:.88rem;
}


/* Multiple vehicle estimate summary */
.qVehicleSummaryBox{
  margin-top:18px;
  border-radius:22px;
  border:1px solid rgba(0,0,0,.08);
  background:#fff;
  padding:16px;
  box-shadow:0 16px 38px rgba(0,0,0,.06);
}
.qVehicleSummaryTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-weight:1000;
  color:#111;
  font-size:1rem;
  margin-bottom:6px;
}
.qVehicleSummaryTitle span{
  color:rgba(0,0,0,.48);
  font-size:.78rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.qVehicleSummaryHelp{
  margin:0 0 12px;
  color:rgba(0,0,0,.52);
  font-weight:650;
  font-size:.86rem;
  line-height:1.45;
}
.qVehicleSummaryList{
  display:grid;
  gap:10px;
}
.qVehicleSummaryItem{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0, 1fr) auto;
  justify-content:space-between;
  gap:14px;
  align-items:center;
  padding:14px;
  border-radius:18px;
  background:

.qInputField{

.qInputField input,
.qInputField select{
  width:100%;
  padding:22px 16px 12px 46px;
  border-radius:14px;
  border:1.5px solid rgba(0,0,0,.10);
  background:#fff;
  font-family:inherit;
  font-size:1rem;
  font-weight:600;
  color:#111;
  outline:none;
  appearance:none;
  -webkit-appearance:none;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}

.qInputField select{
  padding-right:42px;
  cursor:pointer;
  background:#fff url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23000' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E") no-repeat right 16px center;
}

.qInputField label{
  position:absolute;
  left:46px;
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
  color:rgba(0,0,0,.50);
  font-weight:600;
  font-size:1rem;
  background:transparent;
  transition:all .15s ease;
  padding:0 4px;
  margin-left:-4px;
}

.qInputField input:focus + label,
.qInputField input:not(:placeholder-shown) + label,
.qInputField.isFilled label,
.qInputField--select label{
  top:10px;
  transform:translateY(0);
  font-size:.72rem;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:rgba(0,0,0,.55);
}

      /* Quote page shell: copied as a structural idea only.
         Header, centered page, quote card, form inside page. No popup. */
      html {
        scroll-behavior: smooth;
      }

      body[data-quote-page="true"] {
        background: #fff;
        overflow-x: hidden;
      }

      .quotePageMain {
        padding: clamp(2rem, 4vw, 3.5rem) 0 clamp(4rem, 6vw, 5rem);
      }

      .quotePageEmbed {
        width: min(920px, 100%);
        margin: 0 auto;
      }

      .quotePageShell,
      .quotePageShell[data-quote-modal] {
        position: static !important;
        inset: auto !important;
        display: block !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        background-color: transparent !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        overflow: visible !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        transform: none !important;
      }

      .quotePageShell::before,
      .quotePageShell::after,
      .quotePageShell .modal__overlay,

      .quotePageShell .modal__close {
        display: none !important;
        content: none !important;
      }

        position: relative !important;

        margin: 0 auto;

function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatMoney(n) {
  return `$${Number(n || 0).toFixed(0)}`;
}

function clampInt(n) {
  const x = Math.round(Number(n));
  return Number.isFinite(x) ? x : null;
}

function makeId() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  return `lead_${Date.now()}_${Math.random().toString(36).slice(2)}`;
}

function normalizeCoupon(code) {
  return String(code || "").trim().toUpperCase();

function getCouponDiscount(code = quoteState.couponCode) {

}

function priceForVehicle(table, key) {
  const vehicle = quoteState.vehicleType;
  if (!vehicle || !table?.[key]) return null;
  return clampInt(table[key][vehicle]);
}

function normalizeCityKey(city) {

// Validate the contact step and return a map of fieldName -> error message.
function validateContactStep() {
  const errors = {};
  const name = String(quoteState.name || "").trim();
  const phone = String(quoteState.phone || "").trim();
  const city = String(quoteState.city || "").trim();

  if (!name) errors.name = "Please enter your name";

  if (!phone) {
    errors.phone = "Please enter a phone number";
  } else {
    const digits = phone.replace(/\D/g, "");
    if (digits.length < 10) errors.phone = "Please enter a valid phone number";
  }

  if (!city) errors.city = "Please choose your closest city";

  return errors;
}

function buildScriptUrl(action, extraParams = {}) {
  const script = window.SCRIPT_URL || DEFAULT_SCRIPT_URL;
  const params = new URLSearchParams({
    action,
    t: String(Date.now())
  });

  Object.entries(extraParams).forEach(([key, value]) => {
    const safe = String(value ?? "").trim();
    if (safe) params.set(key, safe);
  });

  return `${script}?${params.toString()}`;
}

function isoDate(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function parseLocalDate(ymd) {
  const [y, m, d] = String(ymd || "").split("-").map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}

function normalizeDateValue(raw) {
  const value = String(raw || "").trim();
  if (!value) return "";

  const isoMatch = value.match(/(\d{4}-\d{2}-\d{2})/);
  if (isoMatch) return isoMatch[1];

  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) return "";

  return isoDate(parsed);
}

function extractTimeInfo(raw) {
  const value = String(raw || "").trim();
  if (!value) return null;

  const match12 = value.match(/\b(1[0-2]|0?\d):([0-5]\d)\s*(A\.?M\.?|P\.?M\.?)\b/i);
  if (match12) {
    const rawHour = Number(match12[1]);
    const minute = String(match12[2]).padStart(2, "0");
    const meridiem = String(match12[3] || "")
      .toUpperCase()
      .replaceAll(".", "")
      .startsWith("P") ? "PM" : "AM";

    let hour24 = rawHour % 12;
    if (meridiem === "PM") hour24 += 12;

    return {
      normalized: `${String(hour24).padStart(2, "0")}:${minute}`,
      label: `${rawHour}:${minute} ${meridiem}`
    };
  }

  const match24 = value.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (match24) {
    const hour = String(match24[1]).padStart(2, "0");
    const minute = String(match24[2]).padStart(2, "0");

    return {
      normalized: `${hour}:${minute}`,
      label: `${hour}:${minute}`
    };
  }

  return null;
}

function normalizeTimeValue(raw) {
  return extractTimeInfo(raw)?.normalized || "";
}

function formatTimeLabel(raw, normalized = normalizeTimeValue(raw)) {
  const found = extractTimeInfo(raw);
  if (found?.label) return found.label;
  if (!normalized) return "";

  const [h, m] = normalized.split(":").map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);

  return d.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}

function formatDateNice(ymd) {
  const d = parseLocalDate(ymd);
  if (!d) return ymd || "";
  return d.toLocaleDateString([], {
    weekday: "short",
    month: "short",
    day: "numeric"
  });
}

function monthLabel(date) {
  return date.toLocaleDateString([], {
    month: "long",
    year: "numeric"
  });
}

}

function getRequestedQuotePreset() {
  const params = new URLSearchParams(window.location.search || "");
  const storedPreset = consumeStoredQuotePreset() || {};

  const fromUrl = {
    preset: params.get("preset") || "",
    quick: params.get("quick") || "",
    autoPreset: params.get("autoPreset") || "",
    forcePreset: params.get("forcePreset") || "",
    service: params.get("service") || "",
    category: params.get("category") || "",
    interiorPackage: params.get("interiorPackage") || "",
    exteriorPackage: params.get("exteriorPackage") || "",
    start: params.get("start") || ""
  };

  // URL values win, but storage stays as a backup.
  // This makes the bubble work even if a browser/cache strips part of the query string.
  return {
    ...storedPreset,
    ...Object.fromEntries(
      Object.entries(fromUrl).filter(([, value]) => Boolean(value))
    )
  };
}

function isStandardInsideOutsidePresetRequest(request) {
  if (!request || typeof request !== "object") return false;

  const tokens = [
    request.preset,
    request.quick,
    request.autoPreset,
    request.forcePreset,
    request.service,
    request.category
  ].map(normalizePresetToken);

  return (
    tokens.includes("most-popular") ||
    tokens.includes("standard-in-out") ||
    tokens.includes("standard-inside-outside") ||
    tokens.includes("inside-outside") ||
    tokens.includes("interior-exterior") ||
    tokens.includes("both")
  );
}

function resolveInteriorPackagePreset(value) {
  const token = normalizePresetToken(value);

  if (!token || token.includes("standard")) return "Standard Interior Detail";
  if (token.includes("premium")) return "Premium Deep Clean Interior Detail";
  if (token.includes("deep")) return "Deep Clean Interior Detail";

  return "Standard Interior Detail";
}

function resolveExteriorPackagePreset(value) {
  const token = normalizePresetToken(value);

  if (!token || token.includes("standard")) return "Standard Exterior Detail";
  if (token.includes("clay")) return "Clay Decontamination Exterior Detail";
  if (token.includes("premium")) return "Premium Exterior Detail";

  return "Standard Exterior Detail";
}

function isStandardInsideOutsidePresetActive() {
  return quoteState.presetMode === QUICK_PRESET_STANDARD_INSIDE_OUTSIDE;
}

function applyStandardInsideOutsidePreset(request = {}, options = {}) {
  const startAtVehicle = options.startAtVehicle !== false;

  quoteState.presetMode = QUICK_PRESET_STANDARD_INSIDE_OUTSIDE;
  quoteState.presetLabel = "Standard Inside + Outside";
  quoteState.serviceCategory = "Interior + Exterior";
  quoteState.services = ["Interior Detail", "Exterior Wash"];
  quoteState.interiorPackage = resolveInteriorPackagePreset(request.interiorPackage);
  quoteState.exteriorPackage = resolveExteriorPackagePreset(request.exteriorPackage);
  quoteState.paintCorrectionPackage = "";
  quoteState.ceramicPackage = "";
  quoteState.upkeepFrequency = "";

  if (startAtVehicle) {
    stepIndex = steps.indexOf("vehicleType");
  }
}

function applyQuotePresetFromRequest() {
  const request = getRequestedQuotePreset();

  if (isStandardInsideOutsidePresetRequest(request)) {
    applyStandardInsideOutsidePreset(request, { startAtVehicle: true });
    return true;
  }

  return false;
}

function jumpStandardInsideOutsidePresetToContact() {
  // This is the important part for the yellow bubble flow.
  // Once the customer picks a vehicle, do not let the wizard continue through normal package steps.
  quoteState.presetMode = QUICK_PRESET_STANDARD_INSIDE_OUTSIDE;
  quoteState.presetLabel = "Standard Inside + Outside";
  quoteState.serviceCategory = "Interior + Exterior";
  quoteState.services = ["Interior Detail", "Exterior Wash"];
  quoteState.interiorPackage = "Standard Interior Detail";
  quoteState.exteriorPackage = "Standard Exterior Detail";
  quoteState.paintCorrectionPackage = "";
  quoteState.ceramicPackage = "";
  quoteState.upkeepFrequency = "";
  quoteState.showContactErrors = false;
  quoteState.contactErrors = {};
  stepIndex = steps.indexOf("contact");
}

function enforcePresetStepBeforeRender() {
  if (!isStandardInsideOutsidePresetActive() || !quoteState.vehicleType) return;

  const contactIndex = steps.indexOf("contact");
  if (contactIndex < 0) return;

  // Safety net: if anything tries to send the preset flow through category/service/package steps,
  // force it back to contact before the customer sees the wrong screen.
  if (stepIndex > steps.indexOf("vehicleType") && stepIndex < contactIndex) {
    jumpStandardInsideOutsidePresetToContact();
  }
}

function stepIsActive(stepName) {
  if (isStandardInsideOutsidePresetActive()) {
    if (
      stepName === "serviceCategory" ||
      stepName === "service" ||
      stepName === "interiorPackage" ||
      stepName === "exteriorPackage" ||
      stepName === "paintCorrectionPackage" ||
      stepName === "ceramicPackage" ||
      stepName === "upkeepFrequency"
    ) {
      return false;
    }
  }

  if (stepName === "interiorPackage") return anyServiceRequiresInteriorPackage();
  if (stepName === "exteriorPackage") return anyServiceRequiresExteriorPackage();
  if (stepName === "paintCorrectionPackage") return anyServiceRequiresPaintCorrectionPackage();
  if (stepName === "ceramicPackage") return anyServiceRequiresCeramicPackage();
  if (stepName === "upkeepFrequency") return isUpkeepPlanSelected();

  // After the first vehicle has been saved, keep the customer from re-entering contact info.
  if (stepName === "contact") return !quoteState.vehicles.length || !isContactInfoComplete();

  return true;
}

function getVisibleSteps() {
  return steps.filter(stepIsActive);
}

function nextActiveStepIndex(fromIndex) {
  for (let i = fromIndex + 1; i < steps.length; i++) {
    if (stepIsActive(steps[i])) return i;
  }
  return steps.length - 1;
}

function prevActiveStepIndex(fromIndex) {
  for (let i = fromIndex - 1; i >= 0; i--) {
    if (stepIsActive(steps[i])) return i;
  }
  return 0;
}

function resetPackageSelectionsIfNeeded() {
  if (!quoteState.services.includes("Interior Detail")) quoteState.interiorPackage = "";
  if (!quoteState.services.includes("Exterior Wash")) quoteState.exteriorPackage = "";
  if (!quoteState.services.includes("Paint Correction")) quoteState.paintCorrectionPackage = "";
  if (!quoteState.services.includes("Ceramic Coating")) quoteState.ceramicPackage = "";
  if (!isUpkeepPlanSelected()) quoteState.upkeepFrequency = "";
}

function getServicesForCategory() {
  if (quoteState.serviceCategory === "Interior") {
    return servicesAll.filter(s => s.category === "Interior");
  }

  if (quoteState.serviceCategory === "Exterior") {
    return servicesAll.filter(s => s.category === "Exterior");
  }

  if (quoteState.serviceCategory === "Interior + Exterior") {
    return servicesAll.filter(s => ["Interior", "Exterior", "Both"].includes(s.category));
  }

  return servicesAll;
}

function getSelectedDisplayServices() {
  return quoteState.services.map(service => {
    if (service === "Interior Detail") return quoteState.interiorPackage || service;
    if (service === "Exterior Wash") return quoteState.exteriorPackage || service;
    if (service === "Paint Correction") return quoteState.paintCorrectionPackage || service;
    if (service === "Ceramic Coating") return quoteState.ceramicPackage || service;
    return service;
  });
}

function getSelectedServiceChipData() {
  return quoteState.services.map(service => {
    if (service === "Interior Detail") return { baseLabel: service, displayLabel: quoteState.interiorPackage || service };
    if (service === "Exterior Wash") return { baseLabel: service, displayLabel: quoteState.exteriorPackage || service };
    if (service === "Paint Correction") return { baseLabel: service, displayLabel: quoteState.paintCorrectionPackage || service };
    if (service === "Ceramic Coating") return { baseLabel: service, displayLabel: quoteState.ceramicPackage || service };
    return { baseLabel: service, displayLabel: service };
  });
}

function hasInteriorExteriorBundle() {
  return quoteState.services.includes("Interior Detail") && quoteState.services.includes("Exterior Wash");
}

function getDisplayRangeAddForService(serviceLabel) {
  if (serviceLabel === "Interior Detail") return INTERIOR_DISPLAY_RANGE_ADD;
  if (serviceLabel === "Exterior Wash") return EXTERIOR_DISPLAY_RANGE_ADD;
  if (serviceLabel === "Headlight Restoration") return EXTERIOR_DISPLAY_RANGE_ADD;
  if (serviceLabel === "Paint Correction") return EXTERIOR_DISPLAY_RANGE_ADD;
  if (serviceLabel === "Ceramic Coating") return EXTERIOR_DISPLAY_RANGE_ADD;
  if (serviceLabel === "Interior Upkeep Plan") return INTERIOR_DISPLAY_RANGE_ADD;
  if (serviceLabel === "Exterior Upkeep Plan") return EXTERIOR_DISPLAY_RANGE_ADD;
  if (serviceLabel === "Interior + Exterior Upkeep Plan") return INTERIOR_DISPLAY_RANGE_ADD + EXTERIOR_DISPLAY_RANGE_ADD;
  return 0;
}

function computeUpkeepPrice(serviceLabel, frequency = quoteState.upkeepFrequency) {
  const vehicle = quoteState.vehicleType;
  if (!vehicle || !serviceLabel || !frequency) return null;

  const base = UPKEEP_BASE_PRICES?.[serviceLabel]?.[vehicle];
  const mult = UPKEEP_FREQUENCY_MULTIPLIER?.[frequency];

  if (!Number.isFinite(base) || !Number.isFinite(mult)) return null;
  return clampInt(base * mult);
}

// -------------------------
// ESTIMATE
// -------------------------

function computeEstimateInfo() {
  const vehicle = quoteState.vehicleType;
  const services = quoteState.services || [];

  if (!vehicle || !services.length) return null;

  let subtotal = 0;
  let hasStartingAt = false;
  let displayRangeAdd = 0;

  for (const service of services) {
    if (service === "Interior Detail") {
      const price = priceForVehicle(INTERIOR_DETAIL_PRICES, quoteState.interiorPackage);
      if (!Number.isFinite(price)) return null;
      subtotal += price;
      displayRangeAdd += getDisplayRangeAddForService(service);
      continue;
    }

    if (service === "Exterior Wash") {
      const price = priceForVehicle(EXTERIOR_DETAIL_PRICES, quoteState.exteriorPackage);
      if (!Number.isFinite(price)) return null;
      subtotal += price;
      displayRangeAdd += getDisplayRangeAddForService(service);
      continue;
    }

    if (service === "Headlight Restoration") {
      subtotal += HEADLIGHT_RESTORATION_PRICE;
      displayRangeAdd += getDisplayRangeAddForService(service);
      continue;
    }

    if (service === "Paint Correction") {
      const price = priceForVehicle(PAINT_CORRECTION_PRICES, quoteState.paintCorrectionPackage);
      if (!Number.isFinite(price)) return null;
      subtotal += price;
      displayRangeAdd += getDisplayRangeAddForService(service);
      continue;
    }

    if (service === "Ceramic Coating") {
      const price = CERAMIC_COATING_STARTING_AT?.[quoteState.ceramicPackage];
      if (!Number.isFinite(price)) return null;
      subtotal += price;
      displayRangeAdd += getDisplayRangeAddForService(service);
      hasStartingAt = true;
      continue;
    }

    if (isUpkeepService(service)) {
      const price = computeUpkeepPrice(service, quoteState.upkeepFrequency);
      if (!Number.isFinite(price)) return null;
      subtotal += price;
      displayRangeAdd += getDisplayRangeAddForService(service);
      continue;
    }
  }

  const bundleSavings = hasInteriorExteriorBundle() ? INTERIOR_EXTERIOR_BUNDLE_DISCOUNT : 0;
  const couponDiscount = getCouponDiscount();

  const lowBeforeCoupon = Math.max(0, subtotal - bundleSavings);
  const highBeforeCoupon = Math.max(0, lowBeforeCoupon + displayRangeAdd);

  const low = clampInt(Math.max(0, lowBeforeCoupon - couponDiscount));
  const high = clampInt(Math.max(0, highBeforeCoupon - couponDiscount));

  if (!Number.isFinite(low) || !Number.isFinite(high)) return null;

  return {
    subtotal: clampInt(subtotal),
    lowBeforeCoupon: clampInt(lowBeforeCoupon),
    highBeforeCoupon: clampInt(highBeforeCoupon),
    low,
    high,
    total: low,
    hasStartingAt,
    savings: bundleSavings,
    couponCode: normalizeCoupon(quoteState.couponCode),
    couponDiscount
  };
}

function syncEstimateState() {
  const info = computeTotalEstimateInfo();

  if (!info) {
    quoteState.estimateLow = "";
    quoteState.estimateHigh = "";
    quoteState.estimateIsStartingAt = false;
    quoteState.couponDiscount = 0;
    return null;
  }

  quoteState.estimateLow = String(info.low);
  quoteState.estimateHigh = String(info.high);
  quoteState.estimateIsStartingAt = !!info.hasStartingAt;
  quoteState.couponDiscount = info.couponDiscount || 0;

  return info;
}

function formatEstimateRange(low, high, hasStartingAt = false) {
  if (!Number.isFinite(Number(low))) return "We’ll confirm after assessment";

  const lowNum = clampInt(low);
  const highNum = Number.isFinite(Number(high)) ? clampInt(high) : lowNum;
  const lowText = formatMoney(lowNum);
  const highText = formatMoney(highNum);

  if (highNum > lowNum) {
    return hasStartingAt ? `Starting at ${lowText} - ${highText}` : `${lowText} - ${highText}`;
  }

  return hasStartingAt ? `Starting at ${lowText}` : lowText;
}

function formatEstimateDisplay(info = computeTotalEstimateInfo()) {
  if (!info) return "We’ll confirm after assessment";
  return formatEstimateRange(info.low, info.high, !!info.hasStartingAt);
}

function isContactInfoComplete() {
  return !Object.keys(validateContactStep()).length && !!quoteState.routeGroup;
}

function buildCurrentVehicleQuoteItem({ transient = false } = {}) {
  const info = computeEstimateInfo();
  if (!info) return null;

  return {
    id: transient ? "current" : makeId(),
    vehicleType: quoteState.vehicleType,
    serviceCategory: quoteState.serviceCategory,
    services: getSelectedDisplayServices(),
    baseServices: quoteState.services.slice(),

    interiorPackage: quoteState.interiorPackage,
    exteriorPackage: quoteState.exteriorPackage,
    paintCorrectionPackage: quoteState.paintCorrectionPackage,
    ceramicPackage: quoteState.ceramicPackage,
    upkeepFrequency: quoteState.upkeepFrequency,

    subtotal: info.subtotal,
    lowBeforeCoupon: info.lowBeforeCoupon,
    highBeforeCoupon: info.highBeforeCoupon,
    hasStartingAt: !!info.hasStartingAt,
    savings: info.savings || 0,
    estimateDisplay: formatEstimateRange(info.lowBeforeCoupon, info.highBeforeCoupon, !!info.hasStartingAt)
  };
}

function getAllVehicleQuoteItems(includeCurrent = true) {
  const saved = Array.isArray(quoteState.vehicles) ? quoteState.vehicles.slice() : [];

  if (!includeCurrent) return saved;

  const current = buildCurrentVehicleQuoteItem({ transient: true });
  if (current) saved.push(current);

  return saved;
}

function getVehicleLowBeforeCoupon(item) {
  return Number(item?.lowBeforeCoupon ?? item?.estimateLowBeforeCoupon ?? item?.estimateLow ?? 0);
}

function getVehicleHighBeforeCoupon(item) {
  const low = getVehicleLowBeforeCoupon(item);
  return Number(item?.highBeforeCoupon ?? item?.estimateHighBeforeCoupon ?? item?.estimateHigh ?? low);
}

function computeTotalEstimateInfo() {
  const currentInfo = computeEstimateInfo();
  const savedVehicles = Array.isArray(quoteState.vehicles) ? quoteState.vehicles : [];

  if (!currentInfo && !savedVehicles.length) return null;

  let subtotal = 0;
  let lowBeforeCoupon = 0;
  let highBeforeCoupon = 0;
  let hasStartingAt = false;
  let savings = 0;

  savedVehicles.forEach(item => {
    subtotal += Number(item?.subtotal || 0);
    lowBeforeCoupon += getVehicleLowBeforeCoupon(item);
    highBeforeCoupon += getVehicleHighBeforeCoupon(item);
    hasStartingAt = hasStartingAt || !!item?.hasStartingAt;
    savings += Number(item?.savings || 0);
  });

  if (currentInfo) {
    subtotal += Number(currentInfo.subtotal || 0);
    lowBeforeCoupon += Number(currentInfo.lowBeforeCoupon || 0);
    highBeforeCoupon += Number(currentInfo.highBeforeCoupon || currentInfo.lowBeforeCoupon || 0);
    hasStartingAt = hasStartingAt || !!currentInfo.hasStartingAt;
    savings += Number(currentInfo.savings || 0);
  }

  const couponDiscount = Math.min(getCouponDiscount(), lowBeforeCoupon);
  const low = clampInt(Math.max(0, lowBeforeCoupon - couponDiscount));
  const high = clampInt(Math.max(0, highBeforeCoupon - couponDiscount));

  return {
    subtotal: clampInt(subtotal),
    lowBeforeCoupon: clampInt(lowBeforeCoupon),
    highBeforeCoupon: clampInt(highBeforeCoupon),
    low,
    high,
    total: low,
    hasStartingAt,
    savings: clampInt(savings),
    couponCode: normalizeCoupon(quoteState.couponCode),
    couponDiscount,
    vehicleCount: savedVehicles.length + (currentInfo ? 1 : 0),
    currentInfo
  };
}

function resetCurrentVehicleSelection() {
  Object.assign(quoteState, {
    vehicleType: "",
    serviceCategory: "",
    services: [],

    interiorPackage: "",
    exteriorPackage: "",
    paintCorrectionPackage: "",
    ceramicPackage: "",

    upkeepFrequency: "",

    estimateLow: "",
    estimateHigh: "",
    estimateIsStartingAt: false
  });

  if (isStandardInsideOutsidePresetActive()) {
    applyStandardInsideOutsidePreset({}, { startAtVehicle: false });
  }
}

function restoreVehicleQuoteItem(item) {
  if (!item) return;

  Object.assign(quoteState, {
    vehicleType: item.vehicleType || "",
    serviceCategory: item.serviceCategory || "",
    services: Array.isArray(item.baseServices) ? item.baseServices.slice() : [],

    interiorPackage: item.interiorPackage || "",
    exteriorPackage: item.exteriorPackage || "",
    paintCorrectionPackage: item.paintCorrectionPackage || "",
    ceramicPackage: item.ceramicPackage || "",

    upkeepFrequency: item.upkeepFrequency || ""
  });
}

function getVehicleSummaryLines(items = getAllVehicleQuoteItems(true)) {
  return items.map((item, index) => {
    const services = Array.isArray(item.services) ? item.services.join(", ") : "";
    const vehicle = item.vehicleType || `Vehicle ${index + 1}`;
    return `Vehicle ${index + 1}: ${vehicle}${services ? ` — ${services}` : ""}`;
  });
}

function renderVehicleEstimateSummary() {
  const items = getAllVehicleQuoteItems(true);
  if (!items.length) return "";

  const canRemoveVehicle = items.length > 1;

  return `
    <div class="qVehicleSummaryBox">
      <div class="qVehicleSummaryTitle">Vehicles in this quote</div>
      <div class="qVehicleSummaryList">
        ${items.map((item, index) => `
          <div class="qVehicleSummaryItem${canRemoveVehicle ? " hasRemove" : ""}">
            <div class="qVehicleSummaryMain">
              <div class="qVehicleSummaryName">Vehicle ${index + 1}: ${escapeHtml(item.vehicleType || "Vehicle")}</div>
              <div class="qVehicleSummaryServices">${escapeHtml(Array.isArray(item.services) ? item.services.join(", ") : "")}</div>
            </div>
            <div class="qVehicleSummaryActions">
              <div class="qVehicleSummaryPrice">${escapeHtml(item.estimateDisplay || formatEstimateRange(getVehicleLowBeforeCoupon(item), getVehicleHighBeforeCoupon(item), !!item.hasStartingAt))}</div>
              ${canRemoveVehicle ? `
                <button
                  class="qVehicleRemoveBtn qVehicleRemoveBtn--corner"
                  type="button"
                  data-action="remove-vehicle"
                  data-index="${index}"
                  aria-label="Remove Vehicle ${index + 1} from this quote"
                  title="Remove this vehicle"
                ><span class="qVehicleRemoveX" aria-hidden="true">×</span><span class="qVehicleRemoveText">Remove</span></button>
              ` : ""}
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function markQuoteChangedAfterVehicleListUpdate() {
  quoteState.leadEmailSent = false;
  quoteState.leadEmailSignature = "";
  quoteState.bookingError = "";
  quoteState.addressError = "";
  confirmEditingField = "";
  clearAppointmentSelection();
}

function addAnotherVehicleToQuote() {
  const currentTotalVehicles = getAllVehicleQuoteItems(true).length;

  if (currentTotalVehicles >= MAX_QUOTE_VEHICLES) {
    render();
    return;
  }

  const item = buildCurrentVehicleQuoteItem();

  if (!item) {
    updateNav();
    return;
  }

  quoteState.vehicles = [...(Array.isArray(quoteState.vehicles) ? quoteState.vehicles : []), item];

  resetCurrentVehicleSelection();
  markQuoteChangedAfterVehicleListUpdate();

  stepIndex = steps.indexOf("vehicleType");
  render();
}

function removeVehicleFromQuote(index) {
  const vehicleIndex = Number(index);
  const savedVehicles = Array.isArray(quoteState.vehicles) ? quoteState.vehicles.slice() : [];
  const currentItem = buildCurrentVehicleQuoteItem({ transient: true });
  const totalVehicles = savedVehicles.length + (currentItem ? 1 : 0);

  if (!Number.isInteger(vehicleIndex) || vehicleIndex < 0 || vehicleIndex >= totalVehicles || totalVehicles <= 1) {
    return;
  }

  // Saved vehicles are stored before the currently edited vehicle.
  if (vehicleIndex < savedVehicles.length) {
    savedVehicles.splice(vehicleIndex, 1);
    quoteState.vehicles = savedVehicles;
  } else if (savedVehicles.length) {
    // If the user removes the current vehicle, restore the most recent saved vehicle
    // as the active one so the quote still has at least one vehicle.
    const replacementVehicle = savedVehicles.pop();
    quoteState.vehicles = savedVehicles;
    restoreVehicleQuoteItem(replacementVehicle);
  }

  markQuoteChangedAfterVehicleListUpdate();
  render();
}

// -------------------------
// PROGRESS + NAV
// -------------------------

function ensureProgressDots() {
  const visibleSteps = getVisibleSteps();

  if (!quoteProgressEl) {
    return { dots: quoteDots(), visibleSteps };
  }

  const desiredCount = Math.max(visibleSteps.length, 1);
  const currentDots = Array.from(quoteProgressEl.querySelectorAll(".qpDot"));

  if (currentDots.length !== desiredCount) {
    quoteProgressEl.innerHTML = "";

    for (let i = 0; i < desiredCount; i++) {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "qpDot";
      dot.setAttribute("aria-label", `Progress step ${i + 1} of ${desiredCount}`);
      quoteProgressEl.appendChild(dot);
    }
  }

  return { dots: quoteDots(), visibleSteps };
}

function setProgress() {
  const { dots, visibleSteps } = ensureProgressDots();
  if (!dots.length) return;

  const currentStep = steps[stepIndex];
  const activeIndex = Math.max(0, visibleSteps.indexOf(currentStep));

  dots.forEach((dot, i) => {
    dot.classList.toggle("isOn", i === Math.min(activeIndex, dots.length - 1));
  });
}

function canContinue() {
  const step = steps[stepIndex];

  if (step === "vehicleType") return !!quoteState.vehicleType;
  if (step === "serviceCategory") return !!quoteState.serviceCategory;
  if (step === "service") return quoteState.services.length > 0;

  if (step === "interiorPackage") return !anyServiceRequiresInteriorPackage() || !!quoteState.interiorPackage;
  if (step === "exteriorPackage") return !anyServiceRequiresExteriorPackage() || !!quoteState.exteriorPackage;
  if (step === "paintCorrectionPackage") return !anyServiceRequiresPaintCorrectionPackage() || !!quoteState.paintCorrectionPackage;
  if (step === "ceramicPackage") return !anyServiceRequiresCeramicPackage() || !!quoteState.ceramicPackage;
  if (step === "upkeepFrequency") return !isUpkeepPlanSelected() || !!quoteState.upkeepFrequency;

  if (step === "contact") {
    // Always allow click — validation runs in goNext() and shows inline errors if missing.
    return !quoteState.leadEmailSending;
  }

  if (step === "estimate") return !!computeEstimateInfo();
  if (step === "appointment") return !!quoteState.slotId;
  // Let users click Review My Request so we can show an inline Required message.
  if (step === "address") return true;
  if (step === "confirm") return !quoteState.submittingBooking;
  if (step === "done") return true;

  return true;
}

function getNextButtonText() {
  const step = steps[stepIndex];

  if (step === "contact") return quoteState.leadEmailSending ? "Sending..." : "See My Estimate";
  if (step === "estimate") return "Pick My Appointment Time";
  if (step === "appointment") return "Continue With This Time";
  if (step === "address") return "Review My Request";
  if (step === "confirm") return quoteState.submittingBooking ? "Sending..." : "Request My Appointment";
  if (step === "done") return isQuotePage ? "Back to Home" : "Close";

  return "Continue";
}

function updateNav() {
  if (!quoteBackBtn || !quoteNextBtn) return;

  const step = steps[stepIndex];

  // Hide Continue button on auto-advance steps so users can't accidentally double-tap.
  const isAutoAdvanceStep = step === "vehicleType" || step === "serviceCategory";

  quoteBackBtn.style.display = (stepIndex <= 0 && !quoteState.vehicles.length) || step === "done" ? "none" : "inline-flex";

  if (isAutoAdvanceStep) {
    quoteNextBtn.style.display = "none";
    quoteNextBtn.disabled = true;
  } else {
    quoteNextBtn.style.display = "inline-flex";
    quoteNextBtn.textContent = getNextButtonText();
    quoteNextBtn.disabled = !canContinue();
  }

  if (step === "done") {
    quoteBackBtn.style.display = "none";
    quoteNextBtn.style.display = "inline-flex";
    quoteNextBtn.textContent = isQuotePage ? "Back to Home" : "Close";
    quoteNextBtn.disabled = false;
  }
}

function renderNavPrice() {
  return;
}

function renderMedia(item) {
  if (Array.isArray(item.img)) {
    return `
      <div class="qCardMedia">
        <div class="qCardMediaSplit">
          ${item.img.map(src => `<img src="${escapeHtml(src)}" alt="" loading="lazy" decoding="async">`).join("")}
        </div>
      </div>
    `;
  }

  const zoomStyle = item.zoom ? `style="--imgZoom:${Number(item.zoom)};--carZoom:${Number(item.zoom)}"` : "";
  const zoomClass = item.zoom ? " isZoom" : "";
  const containClass = item.contain ? "isContain" : "";

  return `
    <div class="qCardMedia${zoomClass}" ${zoomStyle}>
      ${item.badge ? `<span class="qCardBadge">${escapeHtml(item.badge)}</span>` : ""}
      ${(item.label === "Paint Correction" || item.label === "Ceramic Coating") ? `<span class="requires-badge">Includes Exterior Wash</span>` : ""}
      <img class="${containClass}" src="${escapeHtml(item.img)}" alt="${escapeHtml(item.label || "")}" loading="lazy" decoding="async">
    </div>
  `;
}

function optionCard(item, selected, action, opts = {}) {
  const cardType = opts.cardType || "qCard--img";

  return `

}

function render() {
  if (!quoteBody) return;

  enforcePresetStepBeforeRender();
  syncEstimateState();
  setProgress();

  const step = steps[stepIndex];

  quoteBody.classList.toggle("quoteBody--success", step === "done");

  if (step === "vehicleType") renderVehicleTypeStep();
  if (step === "serviceCategory") renderServiceCategoryStep();
  if (step === "service") renderServiceStep();
  if (step === "interiorPackage") renderInteriorPackageStep();
  if (step === "exteriorPackage") renderExteriorPackageStep();
  if (step === "paintCorrectionPackage") renderPaintCorrectionPackageStep();
  if (step === "ceramicPackage") renderCeramicPackageStep();
  if (step === "upkeepFrequency") renderUpkeepFrequencyStep();
  if (step === "contact") renderContactStep();
  if (step === "estimate") renderEstimateStep();
  if (step === "appointment") renderAppointmentStep();
  if (step === "address") renderAddressStep();
  if (step === "confirm") renderConfirmStep();
  if (step === "done") renderDoneStep();

  bindStepEvents();
  updateNav();
  renderNavPrice();
}

function renderCalendarHtml(selectedDateSlots) {
  if (!appointmentSlots.length && !appointmentSlotsLoading) {
    return `
      <div class="qNoTimes">
        <div class="qNoTimesIcon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="qNoTimesTitle">No open times right now</div>
        <button class="qNoTimesBtn" type="button" data-action="reload-slots">Try again</button>
      </div>
    `;
  }

  const slotDates = Array.from(new Set(appointmentSlots.map(slot => slot.date).filter(Boolean))).sort();

  if (!selectedCalendarDate && slotDates.length) selectedCalendarDate = slotDates[0];

  if (!calendarMonthDate) {
    const first = parseLocalDate(slotDates[0]) || new Date();
    calendarMonthDate = new Date(first.getFullYear(), first.getMonth(), 1);
  }

  const availableDateSet = new Set(slotDates);
  const year = calendarMonthDate.getFullYear();
  const month = calendarMonthDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const blanks = Array.from({ length: startOffset });
  const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

  return `
    <div class="qCal">
      <div class="qCalHead">
        <button class="qCalNav" type="button" data-action="month-prev" aria-label="Previous month">‹</button>
        <div class="qCalMonth">${escapeHtml(monthLabel(calendarMonthDate))}</div>
        <button class="qCalNav" type="button" data-action="month-next" aria-label="Next month">›</button>
      </div>

      <div class="qCalWeek">
        ${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(d => `<div class="qCalW">${d}</div>`).join("")}
      </div>

      <div class="qCalGrid">
        ${blanks.map(() => `<button class="qCalDay qCalDay--blank" type="button" disabled></button>`).join("")}

        ${days.map(day => {
          const ymd = isoDate(new Date(year, month, day));
          const available = availableDateSet.has(ymd);
          const selected = selectedCalendarDate === ymd;

          return `
            <button class="qCalDay ${selected ? "isSel" : ""} ${available ? "" : "isDisabled"}" type="button" data-action="select-date" data-value="${ymd}" ${available ? "" : "disabled"}>
              ${day}
            </button>
          `;
        }).join("")}
      </div>

      <div class="qTimes">
        <div class="qTimesTitle">${selectedCalendarDate ? `Available times for ${escapeHtml(formatDateNice(selectedCalendarDate))}` : "Choose an available date"}</div>

        ${
          selectedDateSlots.length
            ? `
              <div class="qTimesGrid">
                ${selectedDateSlots.map(slot => `
                  <button class="qTimeBtn ${quoteState.slotId === slot.id ? "isSel" : ""}" type="button" data-action="select-slot" data-id="${escapeHtml(slot.id)}">
                    ${escapeHtml(slot.timeLabel || formatTimeLabel(slot.label || slot.time))}
                  </button>
                `).join("")}
              </div>
            `
            : `<div class="qTimesNone">Select a highlighted date to see available times.</div>`
        }
      </div>
    </div>
  `;
}

function getConfirmEditInputType(field) {
  if (field === "email") return "email";
  if (field === "phone") return "tel";
  return "text";
}

function applyConfirmEdit(field, value) {
  const clean = String(value || "").trim();

  if (field === "name") quoteState.name = clean;
  if (field === "phone") quoteState.phone = clean;
  if (field === "email") quoteState.email = clean;
  if (field === "address") {
    quoteState.address = clean;
    quoteState.addressError = clean ? "" : "Required";
  }

  if (["name", "phone", "email"].includes(field)) {
    quoteState.leadEmailSent = false;
    quoteState.leadEmailSignature = "";
  }
}

function bindStepEvents() {
  if (!quoteBody) return;

  quoteBody.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", handleStepAction);
  });

  const qName = quoteBody.querySelector("#qName");
  const qPhone = quoteBody.querySelector("#qPhone");
  const qCity = quoteBody.querySelector("#qCity");
  const qNotes = quoteBody.querySelector("#qNotes");
  const qCompany = quoteBody.querySelector("#qCompany");
  const qCoupon = quoteBody.querySelector("#qCoupon");
  const qAddress = quoteBody.querySelector("#qAddress");

  if (qName) qName.addEventListener("input", e => {
    quoteState.name = e.target.value;
    if (quoteState.contactErrors?.name && e.target.value.trim()) {
      delete quoteState.contactErrors.name;
      e.target.closest(".qInputField")?.classList.remove("hasError");
      e.target.parentElement?.querySelector(".qFieldError")?.remove();
    }
    updateNav();
  });
  if (qPhone) qPhone.addEventListener("input", e => {
    quoteState.phone = e.target.value;
    if (quoteState.contactErrors?.phone && e.target.value.replace(/\D/g, "").length >= 10) {
      delete quoteState.contactErrors.phone;
      e.target.closest(".qInputField")?.classList.remove("hasError");
      e.target.parentElement?.querySelector(".qFieldError")?.remove();
    }
    updateNav();
  });
  if (qCity) qCity.addEventListener("change", e => {
    quoteState.city = e.target.value;
    syncRouteGroupFromCity();
    clearAppointmentSelection();
    if (quoteState.contactErrors?.city && e.target.value) {
      delete quoteState.contactErrors.city;
      e.target.closest(".qInputField")?.classList.remove("hasError");
      e.target.parentElement?.querySelector(".qFieldError")?.remove();
    }
    updateNav();
  });

  if (qNotes) qNotes.addEventListener("input", e => { quoteState.notes = e.target.value; });
  if (qCompany) qCompany.addEventListener("input", e => { quoteState.honeypot = e.target.value; });

  if (qCoupon) {
    qCoupon.addEventListener("input", e => {
      quoteState.couponCode = e.target.value;
      quoteState.couponMessage = "";
    });
    qCoupon.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        applyCouponFromField();
        render();
      }
    });
  }

  if (qAddress) qAddress.addEventListener("input", e => {
    quoteState.address = e.target.value;
    if (quoteState.addressError && e.target.value.trim()) {
      quoteState.addressError = "";
      e.target.closest(".qInputField")?.classList.remove("hasError");
      e.target.parentElement?.querySelector(".qFieldError")?.remove();
    }
    updateNav();
  });

  quoteBody.querySelectorAll("[data-confirm-input]").forEach(input => {
    const saveConfirmInput = () => {
      const field = input.dataset.confirmInput || "";
      applyConfirmEdit(field, input.value);
      confirmEditingField = "";
      render();
    };

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        saveConfirmInput();
      }
    });

    input.addEventListener("blur", () => {
      saveConfirmInput();
    });
  });
}

function handleStepAction(e) {
  const target = e.currentTarget;
  const action = target.dataset.action;
  const value = target.dataset.value || "";

  // ✅ AUTO-ADVANCE on vehicle pick
  if (action === "select-vehicle") {
    quoteState.vehicleType = value;

    if (isStandardInsideOutsidePresetActive()) {
      clearEstimateDependentState();
      jumpStandardInsideOutsidePresetToContact();
      render();
      return;
    }

    clearEstimateDependentState();
    stepIndex = nextActiveStepIndex(stepIndex);
    render();
    return;
  }

  // ✅ AUTO-ADVANCE on category pick (Interior / Exterior / Both)
  if (action === "select-category") {
    quoteState.serviceCategory = value;
    quoteState.services = [];
    clearEstimateDependentState();
    stepIndex = nextActiveStepIndex(stepIndex);
    render();
    return;
  }

  if (action === "toggle-service") {
    toggleService(value);
    render();
    return;
  }

  if (action === "remove-service") {
    quoteState.services = quoteState.services.filter(s => s !== value);
    resetPackageSelectionsIfNeeded();
    clearEstimateDependentState();
    render();
    return;
  }

  // No auto-advance — user selects, then hits Continue.
  if (action === "select-interior-package") {
    quoteState.interiorPackage = value;
    clearEstimateDependentState();
    render();
    return;
  }

  if (action === "select-exterior-package") {
    quoteState.exteriorPackage = value;
    clearEstimateDependentState();
    render();
    return;
  }

  if (action === "select-paint-package") {
    quoteState.paintCorrectionPackage = paintCorrectionPackages.find(p => p.label === value)?.serviceLabel || value;
    clearEstimateDependentState();
    render();
    return;
  }

  if (action === "select-ceramic-package") {
    quoteState.ceramicPackage = ceramicPackages.find(p => p.label === value)?.serviceLabel || value;
    clearEstimateDependentState();
    render();
    return;
  }

  if (action === "select-upkeep") {
    quoteState.upkeepFrequency = value;
    clearEstimateDependentState();
    render();
    return;
  }

  if (action === "add-another-vehicle") {
    addAnotherVehicleToQuote();
    return;
  }

  if (action === "remove-vehicle") {
    removeVehicleFromQuote(target.dataset.index);
    return;
  }

  if (action === "apply-coupon") {
    applyCouponFromField();
    render();
    return;
  }

  if (action === "reload-slots") {
    appointmentSlotsLoadedKey = "";
    appointmentSlotsError = "";
    maybeLoadAppointmentSlots(true);
    render();
    return;
  }

  if (action === "month-prev" || action === "month-next") {
    if (!calendarMonthDate) calendarMonthDate = new Date();
    const dir = action === "month-next" ? 1 : -1;
    calendarMonthDate = new Date(calendarMonthDate.getFullYear(), calendarMonthDate.getMonth() + dir, 1);
    render();
    return;
  }

  if (action === "select-date") {
    selectedCalendarDate = value;
    render();
    return;
  }

  if (action === "select-slot") {
    selectSlot(target.dataset.id || "");
    render();
    return;
  }

  if (action === "edit-confirm-field") {
    confirmEditingField = target.dataset.field || "";
    render();
    setTimeout(() => {
      const input = quoteBody?.querySelector(`[data-confirm-input="${confirmEditingField}"]`);
      input?.focus?.();
      input?.select?.();
    }, 30);
    return;
  }

  if (action === "save-confirm-edit") {
    const field = target.dataset.field || "";
    const input = quoteBody?.querySelector(`[data-confirm-input="${field}"]`);
    applyConfirmEdit(field, input?.value || "");
    confirmEditingField = "";
    render();
    return;
  }
}

function toggleService(label) {
  if (!label) return;

  if (quoteState.services.includes(label)) {
    quoteState.services = quoteState.services.filter(s => s !== label);
  } else {
    quoteState.services = [...quoteState.services, label];
  }

  if ((label === "Paint Correction" || label === "Ceramic Coating") && !quoteState.services.includes("Exterior Wash")) {
    quoteState.services.unshift("Exterior Wash");
  }

  resetPackageSelectionsIfNeeded();
  clearEstimateDependentState();
}

function applyCouponFromField() {
  const input = quoteBody?.querySelector("#qCoupon");
  const code = normalizeCoupon(input?.value || quoteState.couponCode);

  quoteState.couponCode = code;
  quoteState.couponDiscount = getCouponDiscount(code);

  if (!code) {
    quoteState.couponMessage = "Enter a coupon code first.";
    return;
  }

  if (!quoteState.couponDiscount) {
    quoteState.couponMessage = "That code isn't valid.";
    return;
  }

  quoteState.couponMessage = `Code applied. You saved ${formatMoney(quoteState.couponDiscount)}.`;
}

function clearEstimateDependentState() {
  quoteState.estimateLow = "";
  quoteState.estimateHigh = "";
  quoteState.estimateIsStartingAt = false;
  quoteState.leadEmailSent = false;
  quoteState.leadEmailSignature = "";
  quoteState.bookingError = "";
  quoteState.addressError = "";
  confirmEditingField = "";
  clearAppointmentSelection();
}

function clearAppointmentSelection() {
  quoteState.slotId = "";
  quoteState.slotSourceId = "";
  quoteState.slotLabel = "";
  quoteState.slotDate = "";
  quoteState.slotTime = "";
  appointmentSlots = [];
  appointmentSlotsLoading = false;
  appointmentSlotsLoadedKey = "";
  appointmentSlotsError = "";
  selectedCalendarDate = "";
  calendarMonthDate = null;
}

// -------------------------
// SLOTS
// -------------------------

function getSlotsLoadKey() {
  return [quoteState.city, quoteState.routeGroup].join("|");
}

async function maybeLoadAppointmentSlots(force = false) {
  const key = getSlotsLoadKey();

  // Don't retry the same key automatically — only on explicit user action (force=true).
  // This prevents the infinite "Try again" flashing loop when the request errors out.
  if (!force && appointmentSlotsLoadedKey === key) return;
  if (appointmentSlotsLoading) return;

  appointmentSlotsLoading = true;
  appointmentSlotsError = "";
  updateNav();

  try {
    // POST with text/plain matches the same pattern used by sendLeadNotificationIfNeeded()
    // and submitAppointmentRequest() — both of which are confirmed working. Apps Script
    // treats text/plain as a "simple" request, dodging the CORS preflight that breaks
    // arbitrary GETs against script.google.com.
    const scriptUrl = window.SCRIPT_URL || DEFAULT_SCRIPT_URL;
    const payload = {
      action: "slots",
      city: quoteState.city,
      routeGroup: quoteState.routeGroup,
      t: Date.now()
    };

    const res = await fetch(scriptUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow"
    });

    if (!res.ok) {
      throw new Error(`Server returned ${res.status}`);
    }

    const data = await res.json();

    if (!data?.ok) {
      throw new Error(data?.message || data?.error || "Could not load times.");
    }

    // Build slots with GUARANTEED-UNIQUE keys so clicking one time doesn't highlight all of them.
    appointmentSlots = (data.slots || [])
      .filter(slot => slot?.id)
      .map((slot, index) => {
        const date = normalizeDateValue(slot.date || slot.id);
        const time = normalizeTimeValue(slot.time || slot.id);
        const sourceId = String(slot.id || "");
        return {
          id: `${date}_${time}_${sourceId}_${index}`,
          sourceId,
          label: String(slot.label || slot.id || ""),
          date,
          time,
          timeLabel: formatTimeLabel(slot.label || slot.time || slot.id)
        };
      })
      .filter(slot => slot.date && slot.time)
      .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));

    appointmentSlotsLoadedKey = key;

    const dates = Array.from(new Set(appointmentSlots.map(slot => slot.date))).sort();

    if (!selectedCalendarDate && dates.length) selectedCalendarDate = dates[0];

    if (!calendarMonthDate && dates.length) {
      const first = parseLocalDate(dates[0]) || new Date();
      calendarMonthDate = new Date(first.getFullYear(), first.getMonth(), 1);
    }
  } catch (err) {
    appointmentSlotsError = err?.message || "Could not load appointment times.";
    appointmentSlots = [];
    // CRITICAL: mark this key as "tried" so we don't auto-retry on every render.
    // User must click "Try again" (which calls force=true) to retry.
    appointmentSlotsLoadedKey = key;
  } finally {
    appointmentSlotsLoading = false;
    if (steps[stepIndex] === "appointment") render();
  }
}

function selectSlot(slotId) {
  const slot = appointmentSlots.find(s => s.id === slotId);
  if (!slot) return;

  quoteState.slotId = slot.id;
  quoteState.slotSourceId = slot.sourceId || slot.id;
  quoteState.slotLabel = slot.label || `${formatDateNice(slot.date)} at ${slot.timeLabel}`;
  quoteState.slotDate = slot.date;
  quoteState.slotTime = slot.time;
}

// -------------------------
// PAYLOAD + SUBMIT
// -------------------------

function buildLeadSignature() {
  const vehicleSignature = getAllVehicleQuoteItems(true)
    .map(item => [
      item.vehicleType,
      item.serviceCategory,
      Array.isArray(item.services) ? item.services.join("|") : "",
      item.upkeepFrequency,
      item.estimateDisplay
    ].join("~"))
    .join("##");

  return [
    quoteState.name,
    quoteState.phone,
    quoteState.city,
    vehicleSignature,
    quoteState.notes,
    normalizeCoupon(quoteState.couponCode)
  ]
    .map(v => String(v || "").trim().toLowerCase())
    .join("||");
}

function buildPayload(includeSlot = false) {
  const info = syncEstimateState();
  const currentDisplayServices = getSelectedDisplayServices();
  const vehicleItems = getAllVehicleQuoteItems(true);
  const hasMultipleVehicles = vehicleItems.length > 1;

  const vehicleSummaryLines = getVehicleSummaryLines(vehicleItems);
  const combinedVehicleType = hasMultipleVehicles
    ? `${vehicleItems.length} vehicles: ${vehicleItems.map(item => item.vehicleType).filter(Boolean).join(", ")}`
    : quoteState.vehicleType;

  const combinedServices = hasMultipleVehicles
    ? vehicleSummaryLines
    : currentDisplayServices;

  const combinedBaseServices = hasMultipleVehicles
    ? vehicleItems.flatMap((item, index) =>
        (Array.isArray(item.baseServices) ? item.baseServices : []).map(service => `Vehicle ${index + 1}: ${service}`)
      )
    : quoteState.services.slice();

  const payload = {
    leadId: quoteState.leadId || "",

    name: quoteState.name,
    phone: quoteState.phone,
    email: quoteState.email,
    city: quoteState.city,
    routeGroup: quoteState.routeGroup,
    routeGroupLabel: quoteState.routeGroupLabel,

    vehicleType: combinedVehicleType,
    serviceCategory: hasMultipleVehicles ? "Multiple vehicles" : quoteState.serviceCategory,
    services: combinedServices,
    baseServices: combinedBaseServices,

    interiorPackage: hasMultipleVehicles ? "" : quoteState.interiorPackage,
    interiorCondition: hasMultipleVehicles ? "" : quoteState.interiorPackage,
    exteriorPackage: hasMultipleVehicles ? "" : quoteState.exteriorPackage,
    exteriorCondition: hasMultipleVehicles ? "" : quoteState.exteriorPackage,
    paintCorrectionPackage: hasMultipleVehicles ? "" : quoteState.paintCorrectionPackage,
    ceramicPackage: hasMultipleVehicles ? "" : quoteState.ceramicPackage,
    upkeepFrequency: hasMultipleVehicles ? "" : quoteState.upkeepFrequency,

    vehicles: vehicleItems,
    vehicleCount: vehicleItems.length,
    vehicleSummary: vehicleSummaryLines.join("\n"),

    estimateLow: info?.low ?? "",
    estimateHigh: info?.high ?? "",
    estimateDisplay: formatEstimateDisplay(info),
    estimateIsStartingAt: !!info?.hasStartingAt,
    bundleSavings: info?.savings || 0,

    couponCode: normalizeCoupon(quoteState.couponCode),
    couponDiscount: info?.couponDiscount || 0,

    notes: quoteState.notes,
    address: quoteState.address,

    paymentMode: "after",
    paymentBypass: false,
    ackDeposit: false,
    ackPriceVariance: false,
    depositPaid: false,
    fullPaid: false,
    depositAmount: 0,
    paymentAmountCharged: 0,
    paymentStatus: "appointment_requested",
    squarePaymentId: ""
  };

  if (includeSlot) {
    // Send the ORIGINAL slot id to Apps Script (not the composite uid we use locally to dedupe UI selection).
    payload.slotId = quoteState.slotSourceId || quoteState.slotId;
    payload.slotUid = quoteState.slotId;
    payload.slotLabel = quoteState.slotLabel;
    payload.slotDate = quoteState.slotDate;
    payload.slotTime = quoteState.slotTime;
  }

  return payload;
}

async function sendLeadNotificationIfNeeded({ silent = false } = {}) {
  if (quoteState.honeypot) return { ok: true, skipped: true };

  if (!quoteState.leadId) quoteState.leadId = makeId();

  const signature = buildLeadSignature();

  if (quoteState.leadEmailSent && quoteState.leadEmailSignature === signature) {
    return { ok: true, skipped: true };
  }

  quoteState.leadEmailSending = true;
  if (!silent) render();

  try {
    const payload = buildPayload(false);

    const res = await fetch(window.SCRIPT_URL || DEFAULT_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!data?.ok && !data?.emailSent) {
      throw new Error(data?.message || data?.error || data?.emailError || "Lead email failed.");
    }

    quoteState.leadEmailSent = true;
    quoteState.leadEmailSignature = signature;

    if (data?.leadId) quoteState.leadId = data.leadId;

    return data;
  } catch (err) {
    console.warn("Lead notification failed:", err);
    return { ok: false, error: err?.message || String(err) };
  } finally {
    quoteState.leadEmailSending = false;
    if (!silent && steps[stepIndex] === "contact") render();
    if (silent) updateNav();
  }
}

function maybeSendUpdatedLeadFromEstimateStep() {
  if (steps[stepIndex] !== "estimate") return;
  if (!isContactInfoComplete()) return;
  if (!computeEstimateInfo()) return;

  sendLeadNotificationIfNeeded({ silent: true });
}

async function submitAppointmentRequest() {
  if (!canContinue()) return;

  quoteState.submittingBooking = true;
  quoteState.bookingError = "";
  render();

  try {
    if (!quoteState.leadId) quoteState.leadId = makeId();

    const payload = buildPayload(true);

    const res = await fetch(window.SCRIPT_URL || DEFAULT_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!data?.ok) {
      throw new Error(data?.message || data?.error || data?.emailError || "Could not submit appointment request.");
    }

    quoteState.submittingBooking = false;
    stepIndex = steps.indexOf("done");
    render();
  } catch (err) {
    quoteState.submittingBooking = false;
    quoteState.bookingError = err?.message || "Could not submit appointment request. Please try again.";
    render();
  }
}

// -------------------------
// NAVIGATION
// -------------------------

async function goNext() {
  const step = steps[stepIndex];

  if (step === "done") {
    closeQuote();
    return;
  }

  // Special-case: validate contact form and show inline errors instead of silent disable.
  if (step === "contact") {
    const errors = validateContactStep();
    quoteState.contactErrors = errors;

    if (Object.keys(errors).length || !quoteState.routeGroup) {
      quoteState.showContactErrors = true;
      if (!quoteState.routeGroup && !errors.city) {
        quoteState.contactErrors.city = "Please choose your closest city";
      }
      render();

      // Scroll the first error into view on mobile.
      const firstErr = quoteBody?.querySelector(".qFieldError");
      if (firstErr) firstErr.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    quoteState.showContactErrors = false;
    quoteState.contactErrors = {};

    // Move straight to the estimate. The lead email sends quietly in the background.
    stepIndex = nextActiveStepIndex(stepIndex);
    render();
    sendLeadNotificationIfNeeded({ silent: true });
    return;
  }

  if (step === "address") {
    if (!String(quoteState.address || "").trim()) {
      quoteState.addressError = "Required";
      render();
      const firstErr = quoteBody?.querySelector(".qFieldError");
      if (firstErr) firstErr.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    quoteState.addressError = "";
  }

  if (!canContinue()) {
    updateNav();
    return;
  }

  if (step === "confirm") {
    await submitAppointmentRequest();
    return;
  }

  stepIndex = nextActiveStepIndex(stepIndex);
  render();
  maybeSendUpdatedLeadFromEstimateStep();
}

function goBack() {
  if (stepIndex <= 0) {
    // If they tapped "Add another vehicle" by mistake, Back restores the last saved vehicle.
    if (Array.isArray(quoteState.vehicles) && quoteState.vehicles.length) {
      const lastVehicle = quoteState.vehicles.pop();
      restoreVehicleQuoteItem(lastVehicle);
      clearAppointmentSelection();
      stepIndex = steps.indexOf("estimate");
      render();
    }
    return;
  }

  stepIndex = prevActiveStepIndex(stepIndex);
  render();
}

// -------------------------
// MODAL OPEN / CLOSE
// -------------------------

function openQuote() {
  if (!quoteModal) return;

  lastActiveElQuote = document.activeElement;

  quoteModal.hidden = false;
  quoteModal.removeAttribute("hidden");
  quoteModal.setAttribute("aria-hidden", "false");

  quoteModal.classList.add("isOpen", "is-open", "open", "active");

  quoteModal.style.display = "flex";
  quoteModal.style.opacity = "1";
  quoteModal.style.pointerEvents = "auto";
  quoteModal.style.background = "rgba(0,0,0,.45)";
  quoteModal.style.backdropFilter = "blur(2px)";
  quoteModal.style.webkitBackdropFilter = "blur(2px)";

  document.body.style.overflow = "hidden";

  styleQuoteCloseButtons();

  try {
    applyQuotePresetFromRequest();
    render();

    setTimeout(() => {
      const firstFocusable = quoteModal.querySelector("button, input, select, textarea");
      firstFocusable?.focus?.();
    }, 50);
  } catch (err) {
    console.error("Quote wizard render error:", err);

    if (quoteBody) {
      quoteBody.innerHTML = `
        <h3 class="qStepTitle">Quote form loading issue</h3>
        <p class="qStepSub">Something went wrong while loading the quote form.</p>
        <div class="qDoneBox">
          <div class="qDoneBig">Temporary error</div>
          <div class="qDoneLine">Open the browser console and send the red JavaScript error.</div>
        </div>
      `;
    }
  }
}

function closeQuote() {
  if (isQuotePage) {
    window.location.href = "./index.html";
    return;
  }

  if (!quoteModal) return;

  quoteModal.setAttribute("hidden", "");
  quoteModal.hidden = true;
  quoteModal.setAttribute("aria-hidden", "true");

  quoteModal.classList.remove("isOpen", "is-open", "open", "active");

  quoteModal.style.display = "";
  quoteModal.style.opacity = "";
  quoteModal.style.pointerEvents = "";
  quoteModal.style.background = "";
  quoteModal.style.backdropFilter = "";
  quoteModal.style.webkitBackdropFilter = "";

  document.body.style.overflow = "";

  lastActiveElQuote?.focus?.();
}

window.forceCloseQuote = function () {
  document.body.style.overflow = "";

  const modal = document.querySelector("[data-quote-modal]");

  if (modal) {
    modal.hidden = true;
    modal.setAttribute("hidden", "");
    modal.setAttribute("aria-hidden", "true");
    modal.classList.remove("isOpen", "is-open", "open", "active");
    modal.style.display = "";
    modal.style.opacity = "";
    modal.style.pointerEvents = "";
    modal.style.background = "";
    modal.style.backdropFilter = "";
    modal.style.webkitBackdropFilter = "";
  }
};
